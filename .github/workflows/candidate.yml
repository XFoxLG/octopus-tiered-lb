name: candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to test
        required: true
        type: string
      app_version:
        description: Candidate version label
        required: true
        default: v2.9.3-rc.1
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: candidate-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        id: input
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$APP_VERSION" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-(rc|beta|candidate)[.][0-9]+$ ]] || exit 1
          echo "sha=${REQUESTED_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:candidate-${REQUESTED_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.input.outputs.sha }}
          fetch-depth: 1

      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ steps.input.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.input.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=candidate
          cache-to: type=gha,mode=max,scope=candidate
          build-args: |
            APP_VERSION=${{ steps.input.outputs.version }}
            GITHUB_REPO=${{ github.server_url }}/${{ github.repository }}
            GIT_COMMIT=${{ steps.input.outputs.sha }}
            BUILD_TIME=${{ steps.input.outputs.time }}

      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.input.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ steps.input.outputs.sha }}
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          mkdir -p candidate
          printf 'image=%s@%s\ncommit=%s\nversion=%s\n' "$IMAGE" "$DIGEST" "$COMMIT_SHA" "$VERSION" > candidate/manifest.txt
          cat candidate/manifest.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest
          path: candidate/manifest.txt
          if-no-files-found: error
          retention-days: 30
