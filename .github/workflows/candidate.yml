name: candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to test
        required: true
        type: string
      app_version:
        description: Candidate version label
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: candidate-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.input.outputs.version }}
      image: ${{ steps.source.outputs.image }}
      time: ${{ steps.input.outputs.time }}
      migration_max: ${{ steps.source.outputs.migration_max }}
    steps:
      - name: Validate inputs
        id: input
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$APP_VERSION" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-(rc|beta|candidate)[.][0-9]+$ ]] || exit 1
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Verify source identity
        id: source
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          APP_VERSION: ${{ steps.input.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]] || exit 1
          test -z "$(git status --porcelain)"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:candidate-$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          MIGRATION_MAX="$(find internal/db/migrate -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.go' ! -name '*_test.go' -printf '%f\n' | cut -d_ -f1 | sort -n | tail -1)"
          [[ "$MIGRATION_MAX" =~ ^[0-9]{3}$ ]] || exit 1
          echo "migration_max=$MIGRATION_MAX" >> "$GITHUB_OUTPUT"

  ci:
    needs: [validate]
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.validate.outputs.sha }}

  quality:
    needs: [validate]
    uses: ./.github/workflows/quality.yml
    with:
      checkout-ref: ${{ needs.validate.outputs.sha }}

  toolchain:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1

      - name: Setup Go 1.27.3
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Setup pnpm 10.22.0
        uses: pnpm/action-setup@v4
        with:
          version: '10.22.0'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify toolchain pins
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" = "go1.27.3" ]] || exit 1
          [[ "$(node --version)" =~ ^v22\. ]] || exit 1
          [[ "$(pnpm --version)" = "10.22.0" ]] || exit 1

  image:
    runs-on: ubuntu-latest
    needs: [validate, ci, quality, toolchain]
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1

      - name: Verify source identity
        id: source
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          APP_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]] || exit 1
          test -z "$(git status --porcelain)"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:candidate-$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "sha_tag=ghcr.io/${GITHUB_REPOSITORY,,}:sha-$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:candidate-$ACTUAL_SHA,ghcr.io/${GITHUB_REPOSITORY,,}:sha-$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.created=${{ needs.validate.outputs.time }}
          cache-from: type=gha,scope=candidate
          cache-to: type=gha,mode=max,scope=candidate
          build-args: |
            APP_VERSION=${{ steps.source.outputs.version }}
            GITHUB_REPO=${{ github.server_url }}/${{ github.repository }}
            GIT_COMMIT=${{ steps.source.outputs.sha }}
            BUILD_TIME=${{ needs.validate.outputs.time }}

      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SHA_TAG: ${{ steps.source.outputs.sha_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
          CI_GATE: ${{ needs.ci.result }}
          QUALITY_GATE: ${{ needs.quality.result }}
          TOOLCHAIN_GATE: ${{ needs.toolchain.result }}
          MIGRATION_MAX: ${{ needs.validate.outputs.migration_max }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$MIGRATION_MAX" =~ ^[0-9]{3}$ ]] || exit 1
          mkdir -p candidate
          printf 'image=%s@%s\nsha_tag=%s\ncommit=%s\nversion=%s\nmigration_max=%s\nci_gate=%s\nquality_gate=%s\ntoolchain_gate=%s\nworkflow_run_id=%s\nworkflow_run_url=%s\n' \
            "$IMAGE" "$DIGEST" "$SHA_TAG" "$COMMIT_SHA" "$VERSION" "$MIGRATION_MAX" "$CI_GATE" "$QUALITY_GATE" "$TOOLCHAIN_GATE" "$WORKFLOW_RUN_ID" "$WORKFLOW_RUN_URL" \
            > candidate/manifest.txt
          cat candidate/manifest.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest
          path: candidate/manifest.txt
          if-no-files-found: error
          retention-days: 30
