name: CI

on:
  push:
    branches: [tiered-adaptive-lb, master, codex/lingyuins-v262-port]
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  postgres-stability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: octopus_test
          POSTGRES_DB: octopus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OCTOPUS_TEST_POSTGRES_DSN: postgres://postgres:octopus_test@localhost:5432/octopus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - run: go test -count=1 -p 1 ./internal/op/group -run TestGroupUpdateStability
      # 迁移注册表在进程内是一次性的（AfterAutoMigrate 跑完即清空），所以
      # 「全新 PostgreSQL schema 上跑完整迁移链」必须用独立测试二进制单独执行：
      # 否则同二进制里先跑的 SQLite 测试会吃掉整条 after 链，Postgres 侧零迁移通过。
      # v2.8.6 的迁移 075 方言错误正是从这个盲区漏到线上的。
      - name: PostgreSQL full migration chain (fresh schema)
        # -v 让日志里留下 --- PASS / --- SKIP，避免「静默跳过」被误读成通过。
        run: go test -count=1 -v -p 1 ./internal/db/pgchain/...
      - name: PostgreSQL backup sequence synchronization
        run: go test -count=1 -v -run '^TestSynchronizeImportedSequencesPostgres$' ./internal/op/backup
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # 与 Dockerfile 生产构建一致：纯 Go sqlite 驱动（glebarez/sqlite）无需 CGO。
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Ensure static embed placeholder
        # CI 不构建前端（prod 由 Dockerfile 用 Node/pnpm 构建 out/ 后注入 static/out）。
        # static/static.go 的 //go:embed all:out 需要 static/out 至少有一个文件才能编译，
        # 这里放一个占位文件让全项目 go build 通过；不影响 relay 等内部包的真实编译验证。
        run: mkdir -p static/out && echo 'placeholder for go:embed (CI; frontend built separately in prod)' > static/out/placeholder

      - name: Build (jsoniter tag，与 Dockerfile 生产构建一致)
        run: go build -tags=jsoniter ./...

      - name: Vet relay package
        run: go vet -tags=jsoniter ./internal/relay/...

      - name: Test relay package（含 budget 预算拆分回归测试）
        run: go test -tags=jsoniter ./internal/relay/...

      - name: Token estimate benchmark（400KB 中英混合文本，仅留档不设阈值）
        # v2.8.13：为估算采样阈值与慢告警线提供校准数据。
        run: go test -tags=jsoniter -run '^$' -bench BenchmarkCountTokensLargeMixedText -benchtime 3x ./internal/utils/tokenizer/

      - name: Conformance samples（无 oracle：只复现我方当前行为并校验样本）
        # 协议层三方对拍的第一步：这里不提供 oracle 二进制，验证样本可加载、
        # 我方转换链可用；真正的三方对拍在 conformance-oracle job。
        run: go test -count=1 -tags=jsoniter ./internal/conformance/...

  conformance-oracle:
    # 协议层三方对拍（v2.8.15 起）：我方引擎 vs axonhub（主裁判）vs CLIProxyAPI（次裁判）。
    # 未登记差异 = 红；完整对照报告作为 artifact 上传，用于校准 conformance/deviations.json。
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: |
            go.sum
            conformance/oracle-axonhub/go.sum
            conformance/oracle-cliproxyapi/go.sum

      - name: Download dependencies (main module)
        run: go mod download

      - name: Build conformance oracles
        run: |
          mkdir -p conformance/bin
          (cd conformance/oracle-axonhub && go build -o ../bin/oracle-axonhub .)
          (cd conformance/oracle-cliproxyapi && go build -o ../bin/oracle-cliproxyapi .)

      - name: Three-way conformance（ours vs axonhub vs cliproxyapi）
        env:
          CONFORMANCE_ORACLE_AXONHUB: ${{ github.workspace }}/conformance/bin/oracle-axonhub
          CONFORMANCE_ORACLE_CLIPROXYAPI: ${{ github.workspace }}/conformance/bin/oracle-cliproxyapi
          CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-report.json
        run: go test -count=1 -v -tags=jsoniter ./internal/conformance/...

      - name: Upload conformance report
        # 对照报告在失败时同样上传：它是校准 deviations.json 的输入。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: warn
