name: changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to generate changelog for (for example v1.9.8)
        required: true
        type: string

permissions:
  contents: read

jobs:
  changelog:
    name: Generate release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Generate release notes
        run: |
          set -euo pipefail
          python3 scripts/generate-release-notes.py \
            --tag "$RELEASE_TAG" \
            --output release-notes.md

      - name: Add release notes to summary
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 90
